    <style>
        body { margin: .5rem 0; }
        .container { padding: 0; }
        .prompt { padding-top: 0; }
    
        /* Shared emoji font stack for the problem-image containers */
        .emojifont {
            font-family: Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,Android Emoji,EmojiSymbols,EmojiOne Mozilla,Twemoji Mozilla,Segoe UI Symbol,Noto Color Emoji,EmojiOne Color,emoji;
        }

        .prompt .img {
            display: inline-block;
            font-size: 3rem;
            text-align: center;
            background: #fff;
            border-radius: 1rem;
            height: 5rem;
            line-height: 5rem;
            width: 5rem;
        }
        .prompt .img img {
            min-height: 3rem;
            max-height: 4rem;
            max-width: 4rem;
            vertical-align: -0.5rem;
            image-rendering: pixelated;
        }
        
        .prompt .infield {
            display: block;
            background: #fffae4;
            margin: 1rem 0;
            font-size: 2rem;
            line-height: 2.5rem;
            padding: 1rem;
            min-width: 20rem;
            min-height: 7rem;
            letter-spacing: .18rem;
        }
        
        body .prompt .infield.infield_story,
        .prompt .segbank {
            font-size: 1rem;
            line-height: 1.6rem;
            padding: .5rem;
            letter-spacing: .08rem;
            border-radius: 0;
        }
        body .prompt .infield.infield_story {
            padding-bottom: 0;
        }
        .prompt .segbank {
            background: #fffae4;
            padding: 0.5rem;
        }
        .prompt .segbank .segchip {
            display: inline-block;
            border: 1px solid #05b;
            color: #05b;
            border-radius: .5rem;
            margin: 0 .5rem;
            padding: 0 .5rem;
        }
        /* The in-focus segment's chip in the segment bank: a purple '?' card (render_segment_bank),
           matching the in-focus box border (typebox_focus). Sits before the .segchip.done rule so the
           grey 'done' style (equal specificity, later in source) still wins once the segment is solved. */
        .prompt .segbank .segchip.segchip_focus { color: #a0c; border-color: #a0c; }
        
        .prompt .infield .help,
        .prompt .infield .inp {
            display: inline-block;
        }
        
        .prompt .infield .help .help_wordtt,
        .prompt .infield_story .story_wordtt {
            background: #fff; /* #fffaf0; */ /* must match .prompt .infield_story .story_wordtt color */
            text-decoration: underline solid rgba(119,238,0,.6) .2rem;
            text-underline-offset: .6rem;
        }

        .prompt .infield .help { color: #05b; }
        .prompt .infield_story .story_wordtt { text-underline-offset: .3rem; color: #fff; /* #fffaf0; */ }
        
        .prompt .infield .inp { color: #000; }
        .prompt .infield .inp .spacehelp { color: #ccc; }
        body .prompt .infield .success { color: #090; }
        .prompt .infield .helpwait { display: none; }

        /* Segmented (phoneme / morpheme) question type: parts typed into boxes */
        body .prompt .infield.infield_segmented {
            font-size: 1.2rem;
            line-height: 2.5rem;
            letter-spacing: .12rem;
            overflow-x: auto;
            padding-block: .35rem;   /* vertical room so the solve-time bounce (scale) doesn't trip the overflow-x scroller */
        }
        .prompt .infield_segmented .typebox_wrap { white-space: nowrap; }
        .prompt .infield_segmented .typebox {
            display: inline-block;
            /* content-box: the box is pre-sized to its part and doesn't grow as the child types */
            box-sizing: content-box;
            min-width: 1.5rem;   /* overridden inline per box; see render_segmented_input for the width */
            min-height: 2rem;    /* = line-height, so a typed line box fits without enlarging the box */
            line-height: 2rem;
            margin: 0 .15rem;
            padding: .1rem .3rem;
            border: 1px solid #05b;
            border-radius: .4rem;
            text-align: left;
            vertical-align: middle;
            background: #fff;
            cursor: pointer;     /* tap a box to hear its phoneme (delegated handler in the kb init) */
        }
        /* A completed segment turns green (all correct) or red (a mistake somewhere) */
        .prompt .infield_segmented .typebox.typebox_ok  { background: #e2f5d9; border-color: #3a3; }
        .prompt .infield_segmented .typebox.typebox_err { background: #f6d2d2; border-color: #c33; }
        /* The in-focus GP pair (the class being taught) keeps a purple border - the
           class-intro .gi_match colour - even once the box is completed; the ok/err background still
           shows correctness. This rule sits after ok/err so the purple border wins on a completed
           in-focus box (equal specificity, later in source). It also keeps the full 2px width while
           the other boxes are thinner (1px), so the in-focus box stands out and directs the eye. */
        .prompt .infield_segmented .typebox.typebox_focus { border-width: 2px; border-color: #a0c; }
        /* On solve, a single inflate-deflate refocuses the in-focus box(es), fired apart from the
           score/confetti animation (see segmented_focus_refocus). */
        @keyframes seg_focus_bounce { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .prompt .infield_segmented .typebox.seg_focus_bounce { animation: seg_focus_bounce .5s ease-in-out 1; }
        .prompt .segbank .segchip.done { color: #ccc; border-color: #ddd; }
        /* Marker link ('/X' segment): a rounded half-box joining a vowel box to the silent e that
           marks its free (tense) value; drawn green once the vowel is correct (see draw_segment_connectors) */
        .prompt .infield_segmented .inp { position: relative; }
        .prompt .infield_segmented .segbox_link {
            position: absolute;
            height: .6rem;               /* how far the link drops below the boxes */
            border: 2px solid #3a3;       /* the marker link, kept 2px */
            border-top: none;             /* bottom half of a box only */
            border-bottom-left-radius: .4rem;
            border-bottom-right-radius: .4rem;
            box-sizing: border-box;
            pointer-events: none;
        }
        /* Morpheme-boundary bar ('==' in the problem text): a thin neutral vertical divider drawn between
           two adjacent boxes to show a morpheme seam (e.g. micro|scope). Purely visual - inserted into
           the box run by render_segmented_input, and ignored by draw_segment_connectors' .typebox scan. */
        .prompt .infield_segmented .morph_bar {
            display: inline-block;
            width: .5rem;
            height: 3rem;
            background: #f3dcbd;
            border-radius: 1px;
            vertical-align: middle;
        }

        /* Class intro splash (show_class_intro): image + an example word-to-type with the class's grapheme
           highlighted (.gi_match), shown in .startmenu with .game hidden */
        .classintro { text-align: center; padding: 2rem 1rem; }
        .classintro .gi_image {
            font-size: 4.5rem;
            line-height: 1.2;
            min-height: 5rem;
            margin-bottom: 2rem;
        }
        .classintro .gi_image img {
            max-height: 8rem;
            max-width: 8rem;
            image-rendering: pixelated;
        }
        /* The example word-to-type starts out blurred and comes into focus as the splash appears */
        .classintro .gi_wordtt {
            /* Fixed-width font so each glyph is exactly 1ch: lets the split-digraph link (.gi_split)
               centre its legs on the vowel and marker "e" in pure CSS. letter-spacing MUST stay 0
               to keep one glyph == 1ch. */
            font-family: ui-monospace, "DejaVu Sans Mono", "Courier New", monospace;
            font-size: 2.6rem;
            line-height: 3.5rem;
            letter-spacing: 0;
            animation: gi-focus-animation .8s ease-out both;
        }
        @keyframes gi-focus-animation {
            from { filter: blur(.6rem); }
            to { filter: blur(0); }
        }
        .classintro .gi_match {
            color: #a0c;
            text-decoration: underline solid #a0c .2rem;
            text-underline-offset: .5rem;
        }
        /* Split-digraph intro (e.g. "i.e/aI"): the vowel and its silent marker "e" (with the
           consonant between them) are joined by a rounded half-box that HANGS BELOW the letters,
           echoing the game's marker link (.segbox_link) - short downward legs on the two glyph
           centres, rounded bottom, no top - rather than boxing the letters in. Relies on the
           fixed-width .gi_wordtt font (one glyph == 1ch). The two letters stay purple via .gi_match;
           their underline is dropped so only the hanging link decorates them. */
        .classintro .gi_split {
            display: inline-block;
            position: relative;
            line-height: 1;
            padding: 0 0 .7rem;        /* no side padding: content edge == first/last glyph edge, so .5ch lands on a glyph centre */
        }
        .classintro .gi_split::after {
            content: "";
            position: absolute;
            /* Legs centred on the vowel (first glyph) and marker "e" (last glyph): each glyph is 1ch
               wide, so its centre sits .5ch in from that edge; -.1rem shifts the .2rem leg onto it. */
            left: calc(.5ch - .1rem);
            right: calc(.5ch - .1rem);
            bottom: .1rem;
            height: .5rem;             /* how far the link drops below the letters (cf. .segbox_link) */
            border: .2rem solid #a0c;
            border-top: none;          /* bottom half of a box only */
            border-bottom-left-radius: .4rem;
            border-bottom-right-radius: .4rem;
        }
        .classintro .gi_split .gi_match { text-decoration: none; }
        /* Unobtrusive tip: taught on the intro, applies to the game's tappable boxes */
        .classintro .gi_hint { margin-top: 5rem; font-size: .95rem; color: #999; }

        @keyframes blink-animation { to { visibility: hidden; } }
        
        .cursor_outer { position: relative; }
        .cursor {
            animation: blink-animation 2s steps(2, start) infinite;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #f00;
            width: .2rem;
            height: 1.5rem;
            margin-left: -1px;
            border-right: 0 solid transparent;
        }
        .aged-paper .cursor { border: 2px solid #000; }
        .infield_story .cursor { height: 1.2rem; width: .1rem; }
        .infield .help .cursor { visibility: hidden; }
        
        .wrongchar { text-decoration: underline dotted #05b .2rem; text-underline-offset: .6rem; }
        .infield_story .wrongchar { text-underline-offset: .3rem; }

        .kbdiv { 
            min-width: 23rem;
            margin: 1rem 0.2rem;
        }
        .kbrow0 { text-align: right; }
        .kbrow1 { margin-left: .2rem; }
        .kbrow2 { margin-left: .4rem; }
        .kbrow3 { margin-left: 1.4rem; }
        .kbrow4 { margin-left: 5rem; }
        
        .kbdiv .kbkey {
            display: inline-block;
            font-size: 1rem;
            font-weight: bold;
            /* background: #b38; */
            background: #444;
            text-shadow: 0 0 .2rem black;
            transition: color 0.3s ease;
            color: #fff;
            width: 2.1rem;
            height: 3rem;
            border-radius: .5rem;
            margin: .1rem;
            text-align: center;
            line-height: 3rem;
        }
        .kbdiv .kbspace { width: 11rem; /* background:#309; */ margin-right: 2.5rem; }
        .kbdiv .kbbksp { width: 4rem; /* background:#b22; */ color: #e00; font-size: 150%; }
        .kbdiv .kbhelp { background: #999; }
        .kbdiv .kbkey[data-key="'"] { /* background:#309; */ }
        .kbdiv .kbkey[data-key="a"],
        .kbdiv .kbkey[data-key="e"],
        .kbdiv .kbkey[data-key="i"],
        .kbdiv .kbkey[data-key="o"],
        .kbdiv .kbkey[data-key="u"] { /* background: #3b2; */ color: #7e0; }
        .kbdiv .kbkey[data-key="y"],
        .kbdiv .kbkey[data-key="w"] { /* background: #ca2; */ color: #e90; }
        
        .kbdiv .kbkey.kbactive {
            /* box-shadow: 0 0 .8rem black inset; */
            box-shadow: 0 0 .8rem #ccc inset;
            outline: .3rem solid #e90;
        }
        body .kbdiv.kbdisabled .kbkey { color: rgba(255,255,255,0.7); }

    </style>

    <script>

        // Problem definitions
        /* Entry format and behaviour: see agent/spellbee-content.md */
        // Use e.g. https://getemoji.com/
        // Use e.g. https://ttsmp3.com/ to generate TTS

        // GP pairs that form a CLASS (a drillable set of problems); see agent/spellbee-classes.md
        const class_gp_pairs = {
            // morphemes
            "ing/Ing": 1,
            "en/En": 1,
            "et/Et": 1,
            "ed/t": 1,
            "ed/d": 1,
            "ly/lI": 1,
            "ent/Ent": 1,
            "ant/Ent": 1,
            "tion/SEn": 1,
            "sion/ZEn": 1,  // the -tion/-sion choice is the point: drill them as counterparts
            "con/kEn": 1,
            "ity/ItI": 1,
            "ot/Et": 1,
            "in/In": 1,
            "un/An": 1,
            "re/rI": 1,
            "ful/fUl": 1,
            "ily/IlI": 1,
            "ture/tSE": 1,
            "age/IdZ": 1,
            "ed/Id": 1,
            "de/dI": 1,
            "es/Iz": 1,
            
            // doubling
            "gg/g": 1,
            "ll/l": 1,
            "bb/b": 1,
            "tt/t": 1,
            "ss/s": 1,
            "dd/d": 1,
            "mm/m": 1,
            "nn/n": 1,
            "rr/r": 1,
            "pp/p": 1,
            "cc/k": 1,

            "k/k": 1,
            "c/k": 1,
            "gu/g": 1,  // "u" carries no sound of its own: "guard", "guide", "guess", "guitar"

            "ph/f": 1,
            "ff/f": 1,
            "gh/f": 1,

            "d/d": 1,
            "b/b": 1,

            "th/T": 1,
            "th/D": 1,

            "a/a:": 1,
            "a/ae": 1,
            "a/eI": 1,
            "a/o": 1,
            "a/O:": 1,
            "ai/eI": 1,
            "al/sl": 1,
            "al/O:": 1,
            "ar/a:": 1,
            "are/eE": 1,
            "ay/eI": 1,
            "au/O:": 1,
            "aw/O:": 1,
            // One box per phoneme: the silent "gh" belongs to the vowel unit rather than getting a
            // soundless box of its own. Contrast gh/f below, which does have a sound.
            "augh/O:": 1,  // "augh" = /ɔː/ in "naughty", "caught", "taught"

            "e/I": 1,
            "e/i:": 1,
            "ea/e": 1,
            "ear/IE": 1,
            "ear/eE": 1,
            "ee/i:": 1,
            "er/Er": 1,
            "er/r": 1,
            "er/eE": 1,
            "ere/eE": 1,
            "es/z": 1,
            "ey/I": 1,
            "ear/3:": 1,
            "ea/eI": 1,
            "err/3:": 1, 

            "i/aI": 1,
            "ie/aI": 1,  // pie, die, lie, tie
            "i/i:": 1,
            "ie/I": 1,

            "o/EU": 1,
            "o/A": 1,
            "oi/OI": 1,
            "oo/u:": 1,
            "oo/U": 1,
            "ou/A": 1,
            "ow/EU": 1,
            "ow/aU": 1,
            "oy/OI": 1,
            "or/Er": 1,
            "ou/aU": 1,
            "oa/EU": 1,
            "oe/EU": 1,   // toe, foe, hoe, Joe (contrast oe/u: in "shoe")
            "oe/u:": 1,
            "ol/EU": 1,
            "or/O:": 1,
            "oor/O:": 1,
            "ou/E": 1,
            "or/E": 1,

            "u/U": 1,
            "u/ju:": 1,
            "u/u:": 1,

            "y/j": 1,
            "ng/ng": 1,
            "ch/tS": 1,
            "ce/s": 1,
            "igh/aI": 1,
            "wh/w": 1,
            "qu/kw": 1,   // queen, quick, quit, quiet, question
            "s/z": 1,
            "x/ks": 1,
            "sh/S": 1,
            "n/ng": 1,
            "tch/tS": 1,
            "g/dZ": 1,
            "ck/k": 1,
            "j/dZ": 1,
            "ch/k": 1,
            "se/z": 1,
            "el/sl": 1,
            "kn/n": 1,
            "eigh/eI": 1,
            "mb/m": 1,
            "y/aI": 1,
            "ire/aIE": 1,
            "er/3:": 1,
            "air/eE": 1,
            "ol/sl": 1,
            "le/sl": 1,
            "r/Er": 1,
            "dge/dZ": 1,
            "ge/dZ": 1,
            "c/s": 1,
            "wr/r": 1,
            "ch/S": 1,
            "s/Z": 1,
            "oul/U": 1,
            "ere/IE": 1,
            "ai/e": 1,
            "ig/aI": 1,
            "ui/u:": 1,
            "u/A": 1,
            "y/I": 1,
            // Schwa
            "a/E": 1,
            "e/E": 1,
            "o/E": 1,
            "ur/E": 1,
            "ur/Er": 1,
            // digraphs
            "ei/i:": 1,
            "ie/i:": 1,
            "ea/i:": 1,
            "ou/u:": 1,
            "ew/ju:": 1,
            "ue/ju:": 1,  // due, cue, hue, fuel, value, argue
            // split digraphs: a vowel + silent marker "e" ("magic e"), spanning two boxes with a
            // consonant between them, marked in the problem text by a '/X' e (see seg_gp_pair). The
            // vowel voices its free (tense) value, so the class name joins the two letters with a dot.
            "a.e/eI": 1,  // snake, cake, wave
            "e.e/i:": 1,  // complete, Steve
            "i.e/aI": 1,  // tide, time, slide
            "o.e/EU": 1,  // home, bone, rose
            "u.e/ju:": 1, // cube, cute
            // broken
            "ir/3:": 1,
            "or/3:": 1,
            "ur/3:": 1,
        };
        
        // Other valid GP pairs (they form no class - listed only for validation)
        const other_gp_pairs = {
            "f/f": 1,
            "g/g": 1,
            "h/h": 1,
            "l/l": 1,
            "m/m": 1,
            "n/n": 1,
            "p/p": 1,
            "r/r": 1,
            "s/s": 1,
            "t/t": 1,
            "v/v": 1,
            "w/w": 1,
            "z/z": 1,
            // Silent
            "o/x": 1,
            "e/x": 1,
            "t/x": 1,    // silent "t" in "Christmas"
            // Lax vowels
            "e/e": 1,
            "i/I": 1,
            "o/o": 1,
            // Tense vowels
            // other
            "'t/t": 1,
            // Rare in English: correspondence spells its sound in only ~1-3 word-types across the
            // whole language, so it never makes a useful class. Moved from class_gp_pairs.
            "s/S": 1,    // s = /ʃ/ in "sugar"
            "ar/Er": 1,  // "ar" as the schwa ending in "sugar"
            "tu/tSE": 1, // "tu" = /tʃu/~/tʃə/ in "eventually"
            "io/IE": 1,  // "io" = /ɪə/ in "opinion"
            "ua/UE": 1, // only [usual] [usually]
            "zz/ts": 1,    // "zz" = /ts/ in "pizza"
            "aur/O:": 1,   // "aur" = /ɔː/ in "dinosaur"
            "iew/ju:": 1,  // "iew" = /juː/ in "view"

                if(b1 <= a && a <= b2) { return 0; }
                return Math.min(Math.abs(a - b1), Math.abs(a - b2));
            };
            
            const tapdistance = function(ev, element, key_width) {
                const rect = element.getBoundingClientRect();
                const d1 = mindist(ev.pageX, rect.left, rect.right)/key_width;
                const d2 = mindist(ev.pageY, rect.top, rect.bottom)/key_width;
                if(d1 == 0) { return d2; }
                if(d2 == 0) { return d1; }
                return (d1 + d2);
            };

                    const key = $all_keys[keyix];

        /* EXPLANATION OF TYPED, WORDTT, etc.

            The WORD-TO-TYPE (wordtt) is the part of a problem the child has to produce - the
            concatenation of the entry's <..> regions, with the surrounding text left as context.

            problem text = 'This <is> very <good>.'
            bee.processed_problem = {wordtt: 'isgood', to_display: 'This is very good.', mask: '******__******____*'}

            Display: "I eat ap___."

            emoji: str
            ref: str
            is_story: BOOL
            segments: [str]  // if is_story

            'They <m>=<e>=<n>=<tion>=<ed> my name'. The '=' is only a separator (never shown
            or typed). Sets is_segmented (instead of is_story); the ordered parts are segments
            and the layout (surrounding text vs. the typed run) comes from to_display / mask.
            A '==' separator is a normal separator that additionally marks a morpheme boundary:
            render draws a vertical divider bar between those two boxes (boundaries[], parallel to
            segments). It never merges a morpheme into one box - the boxes stay per-grapheme.

        // Extract the wordtt string from a problem entry
        function process_problem_internals(problem_data) {
            let wordtt_str = '';
            let to_disp_str = '';
            let mask_str = '';
            const segments = []; // the wordtt's parts: words in a story, grapheme segments when segmented
            const phonemes = []; // parallel to segments: ascii phoneme id to voice each segment (see phoneme_sounds)
            const connectors = []; // parallel to segments: true if the segment draws a marker link (see '/X' below)
            const boundaries = []; // parallel to segments: true if a morpheme-boundary bar is drawn before this box (see '==' below)
            const full = problem_data.text;
            // Segmented <..>: '='-separated segments, each optionally "grapheme/phoneme" (else
            // segment_default_phoneme). '/X' = silent + marker link, folded to 'x'. A '=='
            // separator additionally marks a morpheme boundary - a divider bar before the next box.
            const is_segmented = (full.indexOf('=') !== -1);
            let in_type = false;    // inside a <..> region
            let in_phoneme = false; // reading the phoneme id after a '/'
            let seg_grapheme = '';  // characters of the current segment (typed + displayed)
            let seg_phoneme = '';   // explicit phoneme id of the current segment, if any
            let pending_boundary = false; // a '==' was seen: the next flushed segment starts a new morpheme

            // Finish the current segment: record its grapheme and its (explicit or default) phoneme
            const flush_segment = function() {
                let ph = seg_phoneme.length ? seg_phoneme : default_phoneme(seg_grapheme);
                // '/X' = silent + marker link: fold to the silent phoneme 'x' and record the
                // link so render draws a line back to the vowel box two boxes to the left.
                const has_link = (ph === 'X');
                if(has_link) { ph = 'x'; }
                segments.push(seg_grapheme);
                phonemes.push(ph);
                connectors.push(has_link);
                boundaries.push(pending_boundary); // morpheme boundary before this box, set by a preceding '=='
                pending_boundary = false;
                // Flag segments whose phoneme is missing from the master list (a typo, or a
                // grapheme with no default and no explicit /phoneme yet)
                if(is_segmented && phoneme_sounds[ph] === undefined) {
                    console.error('Unknown phoneme', JSON.stringify(ph), 'for segment', JSON.stringify(seg_grapheme), 'in', JSON.stringify(full));
                }
                seg_grapheme = '';
                seg_phoneme = '';
                in_phoneme = false;
            };

            for(let i=0; i<full.length; i++) {
                const ch = full[i];
                if(!in_type) { // text around the <..> region
                    if(ch == '<') { in_type = true; seg_grapheme = ''; seg_phoneme = ''; in_phoneme = false; continue; }
                    to_disp_str += ch;
                    mask_str += '*';
                    continue;
                }
                // Inside a <..> region
                if(ch == '>') { flush_segment(); in_type = false; continue; }
                if(ch == '=') { // segment separator; '==' also opens a new morpheme (a divider bar before the next box)
                    flush_segment();
                    if(full[i+1] === '=') { pending_boundary = true; i++; } // consume the second '=' of '=='
                    continue;
                }
                if(ch == '/') { in_phoneme = true; continue; } // explicit phoneme id follows
                if(in_phoneme) { seg_phoneme += ch; continue; } // phoneme id char (metadata only)
                // Grapheme character: typed and displayed
                wordtt_str += ch;
                to_disp_str += ch;
                seg_grapheme += ch;
                mask_str += '_';
            }

            if(segments.length==0) { console.error('Nothing to type in', problem_data); }

            const proc = {
                'wordtt': wordtt_str,
                'to_display': to_disp_str,
                'mask': mask_str,
                'is_story': (segments.length > 1) && !is_segmented,
                'is_segmented': is_segmented,
                'emoji': problem_data.emoji,
                'ref': problem_data.ref,
                'imgref': problem_data.imgref,
                'segments': segments,
                'phonemes': phonemes,
                'connectors': connectors,
                'boundaries': boundaries,
                'level': problem_data.level
            };
            problem_data.proc_cache = proc;

        // A segment's GP pair, split-digraph aware: normally "<grapheme>/<phoneme>"
        // (lower-cased), e.g. "i/aI", but a vowel whose silent marker "e" sits two boxes

        // "i.e/aI" (tide). Only place a pair string is formed; split pairs live in class_gp_pairs.

        // True when segment i is the silent marker "e" of the split digraph currently in focus:

        // Such a marker is treated as part of the in-focus pattern - withheld from the segment bank
        // (no chip) and given the in-focus purple border - so the child supplies the "magic e".
        function is_focus_split_marker(proc, i, focus_gp_pair) {
            return proc.connectors[i] && seg_gp_pair(proc, i-2) === focus_gp_pair;

        // pair (no chip), the in-focus pair (a purple '?'), and - when a split digraph is drilled -
        // its silent marker "e" (no chip). HELP tiles all.
        function render_segment_bank() {
            const parts = bee.processed_problem.segments;
            const segmented = bee.processed_problem.is_segmented;
            const show_all = bee.help_full_bar;
            const focus_gp_pair = (bee.problem && bee.problem.problem_class) || '';

                    if(is_focus_split_marker(bee.processed_problem, i, focus_gp_pair)) { continue; } // silent marker of the drilled split digraph: no chip

                }

            return chips.join('');

        // Classify how much aid a segment gets, for the per-GP-pair coverage stats (see gp_pair_stat)
        // and the clean-solve check. Mirrors the segment-bank logic in render_segment_bank: the in-focus
        // pair is produced unaided ('focus'); the withheld silent marker "e" of a drilled split digraph

        function segment_aid_kind(i) {
            const pw = bee.processed_problem;
            const gp_pair = seg_gp_pair(pw, i);

            if(predictable_gp_pairs[gp_pair]) { return {'gp_pair':gp_pair, 'kind':'obvious'}; }

        }


        // ---- Multi-part words-to-type (stories and segmented) ----

        // Greedy map of bee.typed onto the ordered parts (segments): a part is 'finished' once
        // enough chars are typed to fill it. Returns {completed, starts:[wordtt index per part]}.
        function parts_progress() {
            const parts = bee.processed_problem.segments;
            const starts = [];
            let start = 0;
            let completed = 0;
            for(let i=0; i<parts.length; i++) {
                starts.push(start);
                if(bee.typed.length >= start + parts[i].length) { completed++; }
                start += parts[i].length;
            }
            return {'completed': completed, 'starts': starts};
        }

        // Status of a part (start, len): 'pending', 'ok' (all correct) or 'error'. Colours the boxes.
        function segment_status(start, len) {
            if(bee.typed.length < start + len) { return 'pending'; }
            const wordtt = bee.processed_problem.wordtt;
            for(let p=start; p<start+len; p++) {
                if(wordtt[p].toLowerCase() != bee.typed[p].toLowerCase()) { return 'error'; }
            }
            return 'ok';
        }

        // Grey the segment-bank chips of correctly-completed parts, matched by data-seg (set in
        // render_segment_bank). A wrongly-typed part isn't greyed; a part with no chip (a predictable
        // segment) simply has nothing to grey. Derived from bee.typed, nothing persisted.
        function update_completed_chips() {
            const prog = parts_progress();
            const parts = bee.processed_problem.segments;
            const $chips = $('.prompt .segbank .segchip');
            $chips.removeClass('done');
            for(let k=0; k<prog.completed; k++) {
                if(segment_status(prog.starts[k], parts[k].length) != 'ok') { continue; } // don't grey a wrongly-typed part
                $chips.filter('[data-seg="'+k+'"]').addClass('done');
            }
        }


        // ---- Segmented (phoneme / morpheme) question type ----

        // Play the clip for a phoneme (ascii id; 'x' is silent). Audio objects are cached; callback
        // fires when it finishes.
        const phoneme_sound_objs = {};
        function play_phoneme(phoneme, callback) {
            if(phoneme_sound_objs[phoneme] === undefined) {
                phoneme_sound_objs[phoneme] = {
                    file: 'assets/sounds/phonemes/ph_' + phoneme.replaceAll(/[^a-zA-Z0-9]/g, '_') + '.mp3',
                    volume: .7,
                    object: false
                };
            }
            _play_obj(phoneme_sound_objs[phoneme], callback);
        }

        // Voice a finished segment. phoneme is its ascii id (see play_phoneme).
        function speak_completed_segment(part, phoneme) {
            play_phoneme(phoneme);
            console.log('segmented part completed:', part, 'phoneme:', phoneme);
        }

        // On solving a segmented problem, draw attention back to the in-focus GP pair: bounce its
        // box(es) once and re-voice the pair's phoneme, then a short pause, then continue.
        // Kept apart in time from the score/confetti reward so it reads as "here is the bit you just
        // learned", not decoration. No-op when the problem has no in-focus GP pair (problem_class
        // 'noclass') or the pair has no phoneme clip.
        function segmented_focus_refocus(callback) {
            const done = callback || function() {};
            const wc = (bee.problem && bee.problem.problem_class) || '';
            if(!bee.processed_problem || !bee.processed_problem.is_segmented || wc.indexOf('/') < 0) { done(); return; }
            const phoneme = wc.split('/')[1];
            if(phoneme === undefined || phoneme_sounds[phoneme] === undefined) { done(); return; }
            const parts = bee.processed_problem.segments;
            const $boxes = bee.$input.find('.typebox');
            setTimeout(function() {
                for(let j=0; j<parts.length; j++) { // bounce every in-focus box - the pair's box(es) plus a split digraph's silent marker "e"
                    if(seg_gp_pair(bee.processed_problem, j) === wc || is_focus_split_marker(bee.processed_problem, j, wc)) {
                        $boxes.filter('[data-seg="'+j+'"]').addClass('seg_focus_bounce');
                    }
                }
                // The CSS bounce (~.5s) runs alongside the phoneme; a short pause then the reward.
                play_phoneme(phoneme, function() { setTimeout(done, 750); });
            }, 750);
        }


        // Render a segmented problem: non-typed text (to_display/mask) plus one box per part, filling
        // as the child types; a completed part's box is green (ok) or red (mistake).
        function render_segmented_input() {
            const s = bee.processed_problem.to_display;
            const mask = bee.processed_problem.mask;
            const wordtt = bee.processed_problem.wordtt;
            const parts = bee.processed_problem.segments;
            const boundaries = bee.processed_problem.boundaries; // true => draw a morpheme divider before this box

            // A part is "in focus" if its GP pair is the class's taught pair. problem_class is
            // built as grapheme+'/'+phoneme in the class derivation; 'noclass' has no '/'. A split
            // digraph's vowel matches its "<vowel>.e/<phoneme>" pair via seg_gp_pair; its silent
            // marker "e" counts as in-focus too (is_focus_split_marker), so the purple border spans
            // the whole magic-e pattern.
            const focus_gp_pair = (bee.problem && bee.problem.problem_class) || '';
            const is_focus_part = function(ix) {
                return (focus_gp_pair.indexOf('/') >= 0 && seg_gp_pair(bee.processed_problem, ix) === focus_gp_pair)
                    || is_focus_split_marker(bee.processed_problem, ix, focus_gp_pair);
            };

            // Box width in characters: normally uniform (sized to the longest part) so it leaks no
            // length clue; a long series switches to compact mode sized to real lengths (below).
            let max_part_len = 0;
            let total_chars = 0;   // characters to render across all boxes
            let has_two_char = false; // is any segment exactly 2 characters?
            for(let i=0; i<parts.length; i++) {
                const len = parts[i].length;
                if(len > max_part_len) { max_part_len = len; }
                total_chars += len;
                if(len == 2) { has_two_char = true; }
            }
            // Proxy for the on-screen length of the box series: the characters in the boxes plus the
            // gaps between adjacent boxes (one per segment boundary, i.e. segments - 1).
            const box_series_len = total_chars + (parts.length - 1);
            // box_char_len(len) -> character widths to render a box holding a `len`-character segment
            let box_char_len;
            if(box_series_len < bee.max_box_len) {
                // Enough room: uniform boxes sized to the longest part (no length clue)
                box_char_len = function(len) { return max_part_len; };
            } else {
                // Compact: size boxes to real length, but render 1-char boxes at 2 chars when any
                // 2-char segment exists (so they don't stand out).
                const one_char_len = has_two_char ? 2 : 1;
                box_char_len = function(len) { return len == 1 ? one_char_len : len; };
            }

            let o = '';
            let type_ix = 0;    // index into wordtt / the current typed position
            let part_ix = 0;    // index into parts
            let part_start = 0; // wordtt index where the current part begins
            for(let i=0; i<s.length; i++) {
                if(mask[i] == '*') { // non-typed text around the parts
                    o += esc_html(s[i]);
                    continue;
                }
                if(i == 0 || mask[i-1] == '*') { // just entered to-type area
                    o += '<span class="typebox_wrap">';
                }
                if(type_ix == part_start) { // open a box at each part start; colour it once the part is completed
                    if(boundaries[part_ix]) { o += '<span class="morph_bar" aria-hidden="true"></span>'; } // morpheme divider before this box
                    const st = segment_status(part_start, parts[part_ix].length);
                    const boxstyle = ' style="min-width:'+(box_char_len(parts[part_ix].length)*1.2)+'ch"';
                    o += '<span class="typebox'+(st == 'ok' ? ' typebox_ok' : (st == 'error' ? ' typebox_err' : ''))+(is_focus_part(part_ix) ? ' typebox_focus' : '')+'" data-seg="'+part_ix+'"'+boxstyle+'>';
                }
                if(type_ix == bee.typed.length) { o += '<span class="cursor_outer"><span class="cursor"></span></span>'; }
                if(type_ix < bee.typed.length) { // already typed (no per-character underline - the box colour shows errors)
                    const userchar = bee.typed[type_ix];
                    o += (userchar == ' ' ? '&nbsp;' : esc_html(userchar));
                }
                if(type_ix == part_start + parts[part_ix].length - 1) { // close the box at the end of the part
                    o += '</span>';
                    part_ix++;
                    part_start = type_ix + 1;
                }
                if(i == s.length - 1 || mask[i+1] == '*') {
                    o += '</span>'; // close .typebox_wrap
                }
                type_ix++;
            }
            return o;
        }


        // Draw the marker link line(s): a '/X' segment is a silent "e" marking the free (tense) value
        // of the vowel two boxes to its left. Once that vowel box is correct, draw a rounded half-box joining the
        // two, measured centre-to-centre off the DOM rects. Rebuilt after each input re-render.
        function draw_segment_connectors() {
            const connectors = bee.processed_problem.connectors;
            if(!connectors || connectors.indexOf(true) < 0) { return; } // nothing to link
            const parts = bee.processed_problem.segments;
            const $boxes = bee.$input.find('.typebox');
            if($boxes.length != parts.length) { return; } // render/parts mismatch: skip rather than mis-draw
            const base = bee.$input.get(0).getBoundingClientRect();
            if(!base.width) { return; } // input not laid out (hidden) - nothing to measure
            const prog = parts_progress();
            for(let i=2; i<connectors.length; i++) {
                if(!connectors[i]) { continue; }
                const vowel_ix = i - 2; // the vowel box the silent "e" lengthens (one box between)
                if(segment_status(prog.starts[vowel_ix], parts[vowel_ix].length) != 'ok') { continue; } // wait until the vowel is right
                const a = $boxes.get(vowel_ix).getBoundingClientRect(); // vowel box
                const c = $boxes.get(i).getBoundingClientRect();        // silent-e box
                const a_mid = (a.left - base.left) + a.width / 2;       // horizontal centre of the vowel box
                const c_mid = (c.left - base.left) + c.width / 2;       // horizontal centre of the silent-e box
                bee.$input.append($('<span class="segbox_link"></span>').css({
                    left:  (a_mid - 1) + 'px',                 // -1 centres the 2px arm on the box mid-line
                    top:   (a.bottom - base.top - 1) + 'px',   // start just under the box bottoms
                    width: (c_mid - a_mid + 2) + 'px'          // centre-to-centre, +2 for the two arm widths
                }));
            }
        }



        // Render a typed input into HTML. prefix=what is typed, s=full string
        function render_to_html(for_help) {
            if(bee.processed_problem.is_segmented && !for_help) { return render_segmented_input(); }
            const line_length = 15; // word wrap after this many characters (for non-stories)

            const s = bee.processed_problem.to_display;

            // Determine line breaks
            // The aim is to leave the underscores in place, so we word wrap according to the target string
            // With a story, wrap_at stays empty and so there is no forced wrapping
            const wrap_at = {};
            if(!bee.processed_problem.is_story) {
                let cur_line = 0;
                for(let i=0; i<s.length; i++) {
                    cur_line++;
                    if(cur_line >= line_length) {
                        wrap_at[i] = 'forced';
                        cur_line = 0;
                        continue;
                    }
                    if(s[i] == ' ') {
                        let is_full = true;
                        for(let j=1; j<=line_length-cur_line; j++) { // lookahead
                            // console.log("ij", i, j, cur_line);
                            if(i+j >= s.length || s[i+j] == ' ') { 
                                is_full = false; 
                                break; 
                            }
                        }
                        if(is_full) {
                            wrap_at[i] = 'at space';
                            cur_line = 0;
                        }
                    }
                }
            }
            // console.log(wrap_at);
            
            let o = '';
            let typed_ix = 0;
            for(let i=0; i<s.length; i++) {
                const is_wordtt = (bee.processed_problem.mask === false || bee.processed_problem.mask[i] == '_'); // whether the character is to be typed
                
                if(for_help) { // We are rendering the help string
                
                    if(is_wordtt) { // We are in the area that should be typed
                        o += '<span class="help_wordtt">';
                        o += (s[i] == ' ' ? '&nbsp;' : esc_html(s[i]));
                        o += '</span>';
                        typed_ix++;
                    } else { // This does not need to be typed
                        o += (s[i] == ' ' ? '&nbsp;' : esc_html(s[i]));
                    }
                    if(wrap_at[i]) { o += '<br>'; }
                    
                } else { // We are rendering the input field
                
                    if(is_wordtt) { // We are in the area that should be typed
                        if(typed_ix < bee.typed.length) { // The user typed this much
                            const userchar = bee.typed[typed_ix];
                            const wrongchar = (s[i].toLowerCase() != userchar.toLowerCase());
                            if(wrongchar) { o += '<span class="wrongchar">'; }

                            if(userchar == ' ') {
                                if((!bee.processed_problem.is_story) || wrongchar) { o += '&nbsp;'; } else { o += ' '; }
                            } else {
                                o += esc_html(userchar);
                            }
                            if(wrongchar) { o += '</span>'; }
                            if(wrap_at[i]) { o += '<br>'; }
                        } else { // The user is still to type this
                            if(typed_ix == bee.typed.length) { 
                                o += '<span class="cursor_outer"><span class="cursor"></span></span>';
                            } 
                            if(bee.processed_problem.is_story) {
                                o += '<span class="story_wordtt">'+esc_html(s[i])+'</span>';
                            } else {
                                o += (s[i] == ' ' ? '<span class="spacehelp">_</span>' : '_');
                            }
                            if(wrap_at[i]) { o += '<br>'; }
                        }
                        typed_ix++;
                    } else { // This does not need to be typed
                        o += (s[i] == ' ' && (!bee.processed_problem.is_story) ? '&nbsp;' : esc_html(s[i]));
                        if(wrap_at[i]) { o += '<br>'; }
                    }
                
                }
            }
            return o;
        }
        
        
        // Render the typing and underscores
        function update_input_field() {
            bee.$input.html(render_to_html(false));
            if(bee.processed_problem.is_story || bee.processed_problem.is_segmented) { update_completed_chips(); }
            if(bee.processed_problem.is_segmented) { draw_segment_connectors(); }
        }
        
        
        // HTML for a problem's picture (local emoji-ref hook, referenced image, emoji, or empty box).
        function problem_image_html(proc) {
            if(proc.ref !== undefined && local_hook_has('emoji_ref')) {
                return bee_local.emoji_ref(proc.ref);
            }
            if(proc.imgref !== undefined) {
                return '<img src="assets/images/words/'+proc.imgref+'">';
            }
            if(proc.emoji === undefined) { return ''; } // no image specified: show an empty box
            let emoji = proc.emoji;
            // Ensure emoji code ends in picture modifier
            if(emoji[emoji.length-1] != "️") { emoji += "️"; }
            return esc_html(emoji);
        }


        // Render a segmented problem's parts as a plain word-to-type for the class intro, with the
        // part(s) whose GP pair is the class's (gp_pair, e.g. "ee/i:") highlighted (.gi_match). A
        // split-digraph class ("i.e/aI") highlights BOTH the vowel and its silent marker "e" two
        // boxes on, wrapping the run from the vowel through that "e" in a .gi_split bracket that
        // echoes the game's marker link (the connector drawn under the boxes during play).
        function render_intro_wordtt(proc, gp_pair) {
            const parts = proc.segments;
            let o = '';
            let close_bracket = -1; // segment index (the marker "e") at which an open .gi_split closes
            for(let i=0; i<parts.length; i++) {
                const match = (seg_gp_pair(proc, i) === gp_pair);
                if(match && gp_pair.indexOf('.') >= 0) { o += '<span class="gi_split">'; close_bracket = i + 2; }
                const highlight = match || (i === close_bracket); // the vowel, or its marker "e"
                o += (highlight ? '<span class="gi_match">'+esc_html(parts[i])+'</span>' : esc_html(parts[i]));
                if(i === close_bracket) { o += '</span>'; close_bracket = -1; }
            }
            return o;
        }


        // Full-screen intro to a new CLASS: picture + an example word-to-type (grapheme highlighted)
        // with narration, then restore the game. callback(true) if shown, callback(false) if the
        // class is not a GP pair and so has nothing to introduce.
        function show_class_intro(problem_ix, gp_pair, callback) {
            console.log("show_class_intro", problem_ix, gp_pair);
            const problem_data = bee.problem_list[problem_ix].proc_cache;
            if(!problem_data.is_segmented) { if(callback) { callback(false); } return; }
            const gp_halves = gp_pair.split('/'); // keep gp_pair itself intact for render_intro_wordtt
            const grapheme = gp_halves[0];
            const phoneme = gp_halves[1];
            // Only GP-pair classes (a real phoneme clip) get an intro
            if(phoneme === undefined || phoneme_sounds[phoneme] === undefined) { if(callback) { callback(false); } return; }

            // Hide the game and splash the picture + highlighted example into the menu container
            $('.game').hide();
            $('.startmenu').html(
                '<div class="classintro">' +
                    '<div class="gi_image emojifont">'+problem_image_html(problem_data)+'</div>' +
                    '<div class="gi_wordtt">'+render_intro_wordtt(problem_data, gp_pair)+'</div>' +
                    '<div class="gi_hint">Tap on the boxes to hear their sound</div>' +
                '</div>'
            ).show();

            // A split digraph's grapheme joins its two letters with a '.' (e.g. "i.e"); the narration
            // names the letters only, so drop it - "i.e" is spoken as "I" "E".
            const letters = grapheme.replace('.', '').toUpperCase().split('').map(function(c) { return '"' + c + '"'; }).join(' ');

            // make_pause takes the NEXT step's index so it resolves lazily (not yet assigned here)
            function make_pause(pause_s, next_ix) {
                return function() { setTimeout(utterances[next_ix], pause_s*1000); };
            }
            
            const sentence = choose_from([
                ['The sound', 'can be written as'],
                ['People can write the sound', 'as'],
                ['You can write the sound', 'as']
            ]);

            const utterances = [];
            utterances[0] = function() { play_text(sentence[0], utterances[1]); };
            utterances[1] = make_pause(.25, 2);
            utterances[2] = function() { play_phoneme(phoneme, utterances[3]); };
            utterances[3] = make_pause(.25, 4);
            utterances[4] = function() { play_text(sentence[1]+' '+letters+'.', utterances[5]); };
            utterances[5] = make_pause(1.8, 6);
            utterances[6] = function() { play_text(choose_from(['Listen:', 'So:', 'So this says:', 'So this is:']), utterances[7]); };
            utterances[7] = make_pause(0.3, 8);
            utterances[8] = function() { play_text(problem_data.wordtt, utterances[9]); };
            // The example word-to-type is spoken alone, then straight on to the phoneme. (The former
            // "as in <context>" carrier utterance was removed - new-scheduling.)
            utterances[9] = make_pause(1.2, 14);
            utterances[14] = function() { play_phoneme(phoneme, utterances[15]); };
            utterances[15] = make_pause(1.5, 16);
            utterances[16] = function() {
                setTimeout(function() {
                    // Hide the intro and bring the game (header, prompt, keyboard) back
                    $('.startmenu').hide().html('');
                    $('.game').show();
                    switch_to_tab('game');
                    if(callback) { callback(true); }
                }, 1000);
            };
            utterances[0]();
        }


        // Display the word-to-type briefly
        function show_help(is_initial) {
            if(bee.processed_problem.is_segmented) {
                // No spelling reveal; just show the boxes and read the whole text out (req 1)
                bee.$help.hide();
                bee.$input.show();
                update_input_field();
                call_local_hook('keyboard_press_hook', [undefined]);
                if(is_initial) { play_text(undefined, undefined, undefined); } // play_text(text, callback, max_timeout)
                return;
            }
            console.log("Disabling help");
            if(bee.processed_problem.is_story) {
                bee.$help.hide();
                bee.$input.show();
                update_input_field();
                call_local_hook('keyboard_press_hook', [undefined]);
                return; 
            }
            
            bee.can_use_help = false;
            if(bee.help_timeout !== false) { clearTimeout(bee.help_timeout); }

            disable_typing();
            bee.$input.hide();
            
            if(!is_initial) { 
                bee.$helpwait.show(); // show a loading animation
                bee.help_asked++;
            }
            
            const help_duration_loading = 1800; // duration of the loading animation
            const help_duration_1 = (is_initial ? 700 : 1200) + bee.processed_problem.to_display.length * 120; // full color, max time while playing
            const help_duration_2 = 1000 + bee.processed_problem.to_display.length * 70; // fading
            const help_duration_3 = 700; // nothing shown
            const help_duration_enable = 4400; // time to enable help again

            setTimeout(function() {
                bee.$helpwait.hide();
                bee.$help.show();
                play_text(undefined, function() {
                    bee.$help.fadeOut({duration: help_duration_2, complete: function() {
                        setTimeout(function() {
                            bee.$input.show();
                            update_input_field();
                            call_local_hook('keyboard_press_hook', [undefined]);
                            enable_typing();
                            console.log("Scheduling enabling help");
                            bee.help_timeout = setTimeout(function(){ 
                                console.log("Enabling help");
                                bee.can_use_help = true;
                                bee.help_timeout = false;
                            }, help_duration_enable);
                        }, help_duration_3);
                    }});
                }, help_duration_1);
            }, is_initial ? 0 : help_duration_loading);
        }
        
                
        function reset_coverage_stats() {
            const pstore = bee.storage.players[bee.player];
            if(pstore.pair_stats) { pstore.pair_stats = {}; }
            delete pstore.sched;     // scheduler cycle state
            delete pstore.pairsched; // per-pair drill / learnt / block state
            save_storage('reset_coverage_stats');
            bee_alert('Coverage stats reset');
        }


        // ---- Per-GP-pair coverage stats (pstore.pair_stats; persisted key, historical name) ----
        // Keyed by GP pair. Six lifetime counters (never reset): [0]/[1] succ/asks IN FOCUS,
        // [2]/[3] succ/asks obvious (not shown), [4]/[5] succ/asks revealed (shown in bank).
        // The scheduler's episode-relative in-focus counts live separately in pairsched.
        function gp_pair_stat(gp_pair) {
            const ps = bee.storage.players[bee.player].pair_stats;
            if(!ps[gp_pair]) { ps[gp_pair] = [0, 0, 0, 0, 0, 0]; }
            return ps[gp_pair];
        }


        // Play the mp3 assigned to a text (default: the current problem's prompt) or use TTS
        function play_text(text, callback, max_timeout) {
            const s = (text === undefined ? bee.processed_problem.to_display : text);
            
            const file_base = s.toLowerCase().replaceAll(/ /g, '_').replaceAll(/[^a-z_]/g, '');
            const file = 'assets/sounds/words/'+file_base+'.mp3';
            
            check_url(file, function(file_exists) {
                if(file_exists) { // play mp3
                    if(max_timeout === undefined) { max_timeout = bee_tts.speaking_time(s) * 1.7; }
                    _play_obj({object: false, file: file, volume: 1}, callback, max_timeout);
                }
                else { // use TTS
                    bee_tts.speak(s, callback);
                }
            });
            
        }
        
        
        function highlight_key(selector) {
            const $keyelem = $(selector);
            const kclass = 'kbactive';
            $keyelem.addClass(kclass);
            setTimeout(function(){ $keyelem.removeClass(kclass); }, 200);
            call_local_hook('keyboard_press_hook', [$keyelem]);
        }
        
        
        function process_typing(input_type, key_distances, is_direct) {
            if(input_type == 'TYPING') {
                if(!bee.can_type) { 
                    playme('notavail');
                    return; 
                }
                
                let typed_key = undefined;
                if(is_direct) {
                    typed_key = key_distances;
                } else {
                    // Check if the user could have meant the next correct character
                    if(bee.typed.length < bee.processed_problem.wordtt.length) {
                        const desired_char = bee.processed_problem.wordtt[bee.typed.length];
                        for(let i=0; i<key_distances.length; i++) {
                            if(key_distances[i][1] < .6 /* ratio to key width */ && key_distances[i][0].toLowerCase() == desired_char.toLowerCase()) {
                                typed_key = desired_char; break;
                            }
                        }
                    }
                    if(typed_key === undefined) { 
                        if(key_distances[0][1] > .5) { return; }
                        typed_key = key_distances[0][0];
                    }
                }
                
                if(typed_key == 'BACKSPACE') {
                    if(bee.typed.length > 0) {
                        bee.typed = bee.typed.substring(0, bee.typed.length-1);
                        update_input_field();
                        bee.backspace_used++;
                        // Coverage stats: a backspace into a segment means it was not a clean first
                        // attempt - lock the segment now holding the cursor so it cannot score.
                        if(bee.processed_problem.is_segmented) {
                            const parts = bee.processed_problem.segments;
                            let acc = 0;
                            for(let k=0; k<parts.length; k++) { acc += parts[k].length; if(bee.typed.length < acc) { bee.seg_locked[k] = true; break; } }
                        }
                        highlight_key('.kbdiv .kbkey[data-key="'+typed_key+'"]');
                    }
                    return;
                }

                if(typed_key == 'HELP') {
                    highlight_key('.kbdiv .kbkey[data-key="'+typed_key+'"]');
                    if(bee.processed_problem.is_segmented) {
                        // Switch the segment bank to full mode: every segment a plain tile (see
                        // render_segment_bank). The in-focus box keeps its purple border. Idempotent once full.
                        if(bee.help_full_bar) { playme('notavail'); return; }
                        bee.help_full_bar = true;
                        bee.help_asked++;
                        $('.prompt .segbank').html(render_segment_bank()).show();
                        update_completed_chips(); // grey chips of already-completed parts in the new bank
                        return;
                    }
                    if(!bee.can_use_help) { playme('notavail'); return; }
                    show_help(false);
                    return;
                }
                if(typed_key == 'PLAY_TEXT') {
                    highlight_key('.kbdiv .kbkey[data-key="'+typed_key+'"]');
                    if(bee.processed_problem.is_story) { return; }
                    play_text();
                    return;
                }
                
                if(bee.typed.length < bee.processed_problem.wordtt.length) {
                    
                    // If we're in a story, check if we have just finished a word to type
                    let story_part_boundary = false;
                    let story_cumulative = '';
                    let story_last_ix = -1;
                    if(bee.processed_problem.is_story) {
                        for(let i=0; i<bee.processed_problem.segments.length - 1; i++) {
                            story_cumulative += bee.processed_problem.segments[i];
                            story_last_ix = i;
                            if(story_cumulative.length > bee.typed.length) { break; }
                            if(story_cumulative.toLowerCase() == bee.typed.toLowerCase()) {
                                story_part_boundary = true;
                                story_cumulative += bee.processed_problem.segments[i+1]; // store the next goal to check after adding the typed character
                                story_last_ix = i+1;
                                break;
                            }
                        }
                    }
                
                    // Segmented: how many parts were complete before this keystroke
                    const seg_completed_before = bee.processed_problem.is_segmented ? parts_progress().completed : 0;

                    if(story_part_boundary && typed_key == ' ') {
                        console.log("Skipping space at story word boundary");
                    } else {
                        bee.typed += typed_key;
                        if(bee.processed_problem.is_story && bee.typed.toLowerCase() == story_cumulative.toLowerCase()) {
                            console.log("Story word completed");
                            if(bee.typed.length < bee.processed_problem.wordtt.length) {
                                const text_to_play = bee.processed_problem.segments[story_last_ix];
                                console.log("Speaking story word", text_to_play);
                                play_text(text_to_play, undefined, undefined); /* text, callback, max_timeout */
                            }
                        }
                        if(bee.processed_problem.is_segmented) {
                            // A keystroke fills at most one part; voice its phoneme only if that part
                            // is correct (never a wrong entry). The final part is voiced too.
                            const seg_prog = parts_progress();
                            const seg_completed = seg_prog.completed;
                            const done_ix = seg_completed - 1;
                            if(seg_completed > seg_completed_before && segment_status(seg_prog.starts[done_ix], bee.processed_problem.segments[done_ix].length) == 'ok') {
                                speak_completed_segment(bee.processed_problem.segments[done_ix], bee.processed_problem.phonemes[done_ix]);
                                // Coverage stats: a clean first-attempt segment (no help, no in-segment
                                // backspace, not a repeat, not already counted) is a success for its GP pair.
                                if(!bee.problem.is_repeat && bee.help_asked === 0
                                   && !bee.seg_locked[done_ix] && bee.seg_kind[done_ix]) {
                                    if(bee.seg_kind[done_ix] === 'focus_marker') {
                                        bee.focus_solved++; // magic "e" produced cleanly: required for the clean-solve check (no pair stat of its own)
                                    } else {
                                        const num_ix = {'focus':0, 'obvious':2, 'revealed':4};
                                        const gp_pair = seg_gp_pair(bee.processed_problem, done_ix);
                                        gp_pair_stat(gp_pair)[num_ix[bee.seg_kind[done_ix]]]++;
                                        if(bee.seg_kind[done_ix] === 'focus') { bee.focus_solved++; } // a clean in-focus segment; the class's per-problem succ is recorded once at completion (sched_record_focus_outcome)
                                    }
                                    bee.seg_locked[done_ix] = true;
                                }
                            }
                        }
                    }
                    update_input_field();
                    highlight_key('.kbdiv .kbkey[data-key="'+typed_key.toLowerCase()+'"]');
                    
                    if(bee.typed.toLowerCase() == bee.processed_problem.wordtt.toLowerCase()) { // Success!
                        disable_typing();
                        bee.$input.addClass('success');

                        // Reschedule (ASK) only when the child used help (the segmented reveal-bank
                        // HELP key, or a plain problem's reveal - both bump help_asked) or over-corrected;
                        // otherwise just advance (OK). A repeat never reschedules again.
                        let outcome = 'OK';
                        if(bee.problem.is_repeat) {
                            outcome = 'OK';
                        } else if(bee.help_asked > 0) {
                            outcome = 'ASK';
                        } else if(bee.processed_problem.is_segmented) {
                            // Reschedule if backspaces exceed a third of the segment count
                            const num_segments = bee.processed_problem.segments.length;
                            if(bee.backspace_used > num_segments/3) { outcome = 'ASK'; }
                        } else if(bee.processed_problem.is_story) {
                            if(bee.backspace_used > 3) { outcome = 'ASK'; }
                        } else { // plain (unsegmented) problem
                            if(bee.backspace_used > 2) { outcome = 'ASK'; }
                        }
                        console.log('success help=', bee.help_asked, 'backspace=', bee.backspace_used, 'outcome=', outcome);
                        // Window/learnt signal: '1' iff the in-focus box(es) - the taught pair plus a split
                        // digraph's magic "e" - were entered cleanly and unaided; deliberately NOT
                        // `outcome === 'OK'` (which folds in non-focus backspaces / the whole-word budget).
                        const focus_clean = bee.help_asked === 0 && bee.focus_shown > 0 && bee.focus_solved === bee.focus_shown;
                        sched_record_focus_outcome(focus_clean);

                        if(outcome == 'ASK') {
                            reschedule_question(bee.problem);
                        } else { // 'OK'
                            queue_success();
                        }
                        
                        /* 
                        call_local_hook('success_hook', [bee.problem.problem_ix, bee.problem_list[bee.problem.problem_ix].text, bee.player, bee.help_asked, -1]);
                        */

                        const on_success = function() {
                            success_common({'skip_this_score':bee.problem.is_repeat});
                        };

                        // Story / segmented: re-read the whole text before advancing (req 6)
                        const re_read = (bee.processed_problem.is_story || bee.processed_problem.is_segmented);
                        if(bee.processed_problem.is_segmented) {
                            // The final part's phoneme was just voiced; pause ~1s to let it finish,
                            // then re-read the whole problem, refocus the in-focus GP pair (bounce +
                            // its phoneme) apart from the reward, then the success actions.
                            setTimeout(function() {
                                play_text(undefined, function() { segmented_focus_refocus(on_success); }, undefined);
                            }, 1000);
                        } else if(re_read) { play_text(undefined, on_success, undefined); } else { on_success(); }
                    }
                }
                return;
            }
        }

        // Initialize a question
        function start_question14(problem) {

            bee.focus_shown = 0;   // per-problem: in-focus boxes presented - the taught pair's box plus a split digraph's magic "e" (clean-solve denominator)
            bee.focus_solved = 0;  // per-problem: in-focus boxes entered cleanly & unaided (clean-solve numerator)

            // Per-GP-pair coverage stats: classify each segment once, when first shown, and count the
            // "shown" coverage (the odd counters) and this problem's in-focus box count (focus_shown).

            if(bee.processed_problem.is_segmented && !bee.problem.is_repeat) {

                    gp_pair_stat(c.gp_pair)[denom_ix[c.kind]]++;

                }
