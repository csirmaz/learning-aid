        function try_get_new_problem10(problem_class) {
            let trials = 50;

            let problem_ix = undefined;
            let last_ok_ix = undefined; // last candidate that cleared the duplicate check
            let log = 'needclass:'+problem_class;
            const queue = get_question_queue();            
            
            while(trials > 0) {
                log += ' trials:'+trials;
                trials--;
                
                if(problem_class !== undefined) { // We have a desired class (subsequent problems)
                    const ixs = bee.class_to_ix[problem_class];
                    if(ixs === undefined) { log += ' class_not_found'; break; }
                    if(ixs.length == 0) { log += ' class_empty'; break; }
                    // Choose a problem at random (not by level)
                    problem_ix = choose_from(ixs);
                    log += ' pix:'+problem_ix;
                    // ensure we choose a new problem (check the queue)
                    const dupl = queue_holds_problem(queue, problem_ix);
                    if(dupl && trials > 0) { log += ' norep'; continue; } // retry for a non-duplicate while we can
                    if(!dupl) { last_ok_ix = problem_ix; } // remember the last genuine non-duplicate
                    break;
                }

                if(problem_class === undefined) { // first problem
                    // Choose a problem at random from all enabled problems (not by level)
                    const enabled = [];
                    for(let k=0; k<bee.problem_list.length; k++) { if(bee.problem_list[k] !== false) { enabled.push(k); } }
                    if(enabled.length === 0) { log += ' none_available'; break; } // every problem is disabled
                    problem_ix = choose_from(enabled);
                    log += " pix:"+problem_ix;
                    // ensure we choose a new problem (check the queue)
                    if(bee.problem_list.length > 1 && trials > 0) {
                        if(queue_holds_problem(queue, problem_ix)) { log += ' norep'; continue; }
                    }
                    break;
                }

            }
            console.log('try_get_new_problem: '+log);
            if(trials == 0) { return last_ok_ix; } // last-resort problem on exhaustion, not undefined
            return problem_ix;
        }


        // Pick an example problem to introduce a class's grapheme: prefer a problem OTHER than
        // exclude_ix (so the intro doesn't reveal the pending one), else fall back to exclude_ix.
        function intro_problem_for_class(problem_class, exclude_ix) {
            const problem_ixs = bee.class_to_ix[problem_class];
            if(problem_ixs !== undefined && problem_ixs.length > 0) {
                const choices = problem_ixs.filter(function(ix) { return ix != exclude_ix; });
                if(choices.length > 0) { return choose_from(choices); }
            }
            return exclude_ix;
        }


        // ==== Puzzle-cycle scheduler (see new-scheduling) ====
        // Drills a small frequency-ordered set of GP pairs to mastery, plus a "joker" review
        // slot, spaced across sessions. A CYCLE = shuffled drill set + one joker; a SLOT = one
        // pair's run of <= puzzle_needs problems. State persists in pstore.sched (cycle) and
        // pstore.pairsched (per pair): window/asks/succ/chosen_at reset on entry; learnt+block_until persist.

        const SCHED = {
            learnt_fast_asks: 8, learnt_fast_succ: 7, // >=7 of the latest 8 -> learnt (~2 days)
            learnt_asks: 12, learnt_succ: 10,         // >=10 of the latest 12 -> learnt (~3 days)
            hard_asks: 4, hard_rate: 0.25,            // >=4 asks and <25% success -> too difficult
            hard_block_days: 14,
            park_asks: 16, park_block_days: 7,        // >16 asks without resolving -> park (rest & retry)
            relapse_succ: 6,                          // learnt pair <6 of latest 12 in joker -> un-learn
            joker_tricky_p: 0.3, joker_learnt_p: 0.3, // joker branch probabilities (remainder = random class)
            joker_maint_min_learnt: 8                 // >= this many loaded learnt classes -> joker fallback drops future (not-yet-drilled) pairs
        };

        // Per-CLASS scheduler record (persisted, lazily created). Keyed by the drilled class - always a
        // GP-pair-shaped string, but a CLASS, not necessarily a bare GP pair: it may be a plain GP-pair
        // class ("ee/i:"), a split-phoneme class spanning two boxes ("i.e/aI"), or a GP pair that recurs
        // across several segments of one word. Every field below is per class / per in-focus problem.
        // The `pair` parameter is a historical name - read it as "class". Callers always pass a drilled
        // class: problem_class (sched_record_focus_outcome), a drill-set entry (sched_start_cycle), or a
        // slot's class (sched_slot_end_check). The persisted key `pairsched` and its sub-fields keep
        // their names for backwards compatibility - do not rename them.
        function pairsched(pair) {
            const p = bee.storage.players[bee.player];
            if(!p.pairsched) { p.pairsched = {}; }
            if(!p.pairsched[pair]) {
                p.pairsched[pair] = {
                    window: '',    // latest <=12 in-focus problem outcomes ('1' clean solve / '0' aided-or-over-corrected); drives learnt & relapse
                    asks: 0,       // in-focus PROBLEMS this drill episode (one per problem, not per segment); zeroed on entry; drives too-difficult & park
                    succ: 0,       // cleanly-solved in-focus problems this drill episode; zeroed on entry; drives the too-difficult rate
                    chosen_at: 0,  // when the class last entered the drill set (ms UTC); telemetry
                    learnt: false, // consolidated: drilled no more, resurfaces only via the joker until relapse
                    block_until: 0 // rest-window end (ms UTC): too-difficult (14d) or parked (7d); ineligible for the drill set until then
                };
            }
            return p.pairsched[pair];
        }
        function sched_is_learnt(pair) { const p = bee.storage.players[bee.player].pairsched; return !!(p && p[pair] && p[pair].learnt); }
        function sched_is_blocked(pair) { const p = bee.storage.players[bee.player].pairsched; return !!(p && p[pair] && p[pair].block_until > Date.now()); }
        function sched_recent_succ(win, n) {
            const s = win.slice(-n); let c = 0;
            for(let i=0; i<s.length; i++) { if(s[i] === '1') { c++; } }
            return c;
        }

        // Teachable GP pairs in drill order (most frequent first), from the precomputed gp_pair_order,
        // limited to pairs that currently have problems loaded. The order is computed offline by
        // tools/gen_gp_pair_order.js. Any teachable pair
        // missing from the precomputed order (e.g. added since it was last regenerated) is appended
        // last, so it is still drilled rather than silently skipped.
        function sched_frequency_order() {
            const loaded = function(c) { return bee.class_to_ix[c] && bee.class_to_ix[c].length >= 1; };
            const order = gp_pair_order.filter(loaded);
            const seen = {};
            for(let i=0; i<gp_pair_order.length; i++) { seen[gp_pair_order[i]] = true; }
            for(const c in bee.class_to_ix) {
                if(seen[c]) { continue; }
                if(c.indexOf('/') < 0 || !class_gp_pairs[c] || !loaded(c)) { continue; }
                order.push(c);
            }
            return order;
        }

        // (Re)build the drill set for a new cycle: keep still-eligible members, pull in the next
        // frequency-ordered pairs to reach drill_problems, reset stats for the newcomers, shuffle.
        // (The look-alike-vowel spacing is baked into gp_pair_order by tools/gen_gp_pair_order.js, so
        // the next few frequency-ordered pairs already differ in main vowel letter - see that const.)
        function sched_start_cycle() {
            const p = bee.storage.players[bee.player];
            if(!p.sched) {
                p.sched = {
                    set: [],    // string[]: the cycle's shuffled drill set - GP-pair/class keys (e.g. 'ee/i:'), one drill slot each in cursor order
                    cursor: 0,  // int: position in the cycle - < set.length is that drill slot, == set.length is the joker slot, > means start a new cycle
                    cur: null   // null | {cls:string, pair:string|null, joker:bool}: the slot sched_next_slot last dispensed (cls = its class), kept for its end-of-slot check
                };
            }
            const order = sched_frequency_order();
            const eligible = function(pair) { return bee.class_to_ix[pair] && !sched_is_learnt(pair) && !sched_is_blocked(pair); };
            const contributed = function(s) { let n = 0; for(let i=0;i<s.length;i++){ n += Math.min(bee.class_to_ix[s[i]].length, bee.puzzle_needs); } return n; };
            let set = (p.sched.set || []).filter(eligible); // keep members still worth drilling
            for(let i=0; i<order.length && contributed(set) < bee.drill_problems; i++) {
                const pair = order[i];
                if(set.indexOf(pair) >= 0 || !eligible(pair)) { continue; }
                set.push(pair);
                const rec = pairsched(pair); // fresh drill episode for the newcomer; `pair` is a drill class (may be a split-phoneme class)
                // asks/succ/window zeroed here and re-accumulated per in-focus problem; pair_stats[pair][0]/[1] keep growing as lifetime coverage
                rec.window = ''; rec.asks = 0; rec.succ = 0; rec.chosen_at = Date.now(); rec.learnt = false; rec.block_until = 0;
            }
            shuffle(set); // in-place, from common.js
            p.sched.set = set;
            p.sched.cursor = 0;
            console.log('sched_start_cycle', set);
        }

        // Pick the joker slot's class: 30% tricky, 30% a random learnt pair, else a random non-drilled
        // class; with no learnt pairs, 30% tricky / 70% random. Excludes the drill set and blocked/parked
        // pairs. Once the player has a solid review bank (>= joker_maint_min_learnt loaded learnt classes),
        // the 40% fallback pool also drops not-yet-drilled ("future") GP pairs, so it reviews only learnt
        // pairs + never-drilled classes (tricky, calendar, noclass, thematic) instead of cold-previewing.
        function sched_pick_joker() {
            const p = bee.storage.players[bee.player];
            const inset = (p.sched && p.sched.set) ? p.sched.set : [];
            const loaded = function(c) { return bee.class_to_ix[c] && bee.class_to_ix[c].length >= 1; };
            // Mastered classes still worth reviewing (learnt pairs are never in the drill set).
            const learnt = Object.keys(p.pairsched || {}).filter(function(pair) {
                return sched_is_learnt(pair) && loaded(pair) && inset.indexOf(pair) < 0;
            });
            const maint = learnt.length >= SCHED.joker_maint_min_learnt; // fallback drops future pairs
            const random_class = function() {
                const cand = Object.keys(bee.class_to_ix).filter(function(c) {
                    if(!loaded(c)) { return false; }
                    if(inset.indexOf(c) >= 0) { return false; }
                    if(c.indexOf('/') >= 0 && sched_is_blocked(c)) { return false; }
                    if(maint && c.indexOf('/') >= 0 && !sched_is_learnt(c)) { return false; } // drop not-yet-drilled pairs
                    return true;
                });
                return cand.length ? choose_from(cand) : choose_from(Object.keys(bee.class_to_ix));
            };
            const tricky_ok = bee.class_to_ix['tricky'] && bee.class_to_ix['tricky'].length > 0;
            const r = Math.random();
            if(r < SCHED.joker_tricky_p && tricky_ok) { return 'tricky'; }
            if(learnt.length > 0 && r < SCHED.joker_tricky_p + SCHED.joker_learnt_p) { return choose_from(learnt); }
            return random_class();
        }

        // Advance to the next cycle slot, recording it in sched.cur (its .cls is the slot's class;
        // read it from there); start a new cycle when the cursor runs past the joker.
        function sched_next_slot() {
            const p = bee.storage.players[bee.player];
            if(!p.sched || !p.sched.set || p.sched.cursor === undefined || p.sched.cursor > p.sched.set.length) {
                sched_start_cycle();
            }
            let cls, cur;
            if(p.sched.cursor < p.sched.set.length) {
                cls = p.sched.set[p.sched.cursor];
                cur = {cls: cls, pair: cls, joker: false};
            } else { // joker slot (cursor == set.length)
                cls = sched_pick_joker();
                cur = {cls: cls, pair: (cls.indexOf('/') >= 0 && sched_is_learnt(cls)) ? cls : null, joker: true};
            }
            p.sched.cursor++;
            p.sched.cur = cur;
        }

        // Learnt / park / too-difficult check (drill slot) or relapse check (joker slot) for the
        // slot that just finished. No-op at startup (cur null) or a non-pair joker slot.
        function sched_slot_end_check(cur) {
            if(!cur) { return; }
            const now = Date.now();
            if(cur.joker) {
                if(cur.pair && sched_is_learnt(cur.pair)) {
                    const rec = pairsched(cur.pair);
                    if(sched_recent_succ(rec.window, 12) < SCHED.relapse_succ) { rec.learnt = false; console.log('sched relapse', cur.pair); }
                }
                return;
            }
            const pair = cur.pair; // the slot's drilled class (may be a split-phoneme class, e.g. "i.e/aI"), not a bare GP pair
            if(!pair) { return; }
            const rec = pairsched(pair);
            // Fast route disabled: 7/8 could graduate a pair on its first ~2-day episode, with no spaced
            // retrieval - too thin a basis for our consolidation-profile learner. Require the full window. TODO: spaced retest.
            // if(rec.window.length >= SCHED.learnt_fast_asks && sched_recent_succ(rec.window, SCHED.learnt_fast_asks) >= SCHED.learnt_fast_succ) { rec.learnt = true; console.log('sched learnt (fast)', pair); return; }
            if(rec.window.length >= SCHED.learnt_asks && sched_recent_succ(rec.window, SCHED.learnt_asks) >= SCHED.learnt_succ) { rec.learnt = true; console.log('sched learnt', pair); return; }
            if(rec.asks >= SCHED.hard_asks && rec.succ / rec.asks < SCHED.hard_rate) { rec.block_until = now + SCHED.hard_block_days*86400000; console.log('sched too-difficult', pair); return; }
            if(rec.asks > SCHED.park_asks) { rec.block_until = now + SCHED.park_block_days*86400000; console.log('sched parked', pair); return; }
        }

        // Record one in-focus PROBLEM outcome for the drilled CLASS at completion. One problem is one
        // ask; it counts as a success ('clean') iff every in-focus segment - the class's box(es), plus a
        // split digraph's magic "e" - was filled cleanly and unaided (this is focus_clean, computed at
        // the call site: no help, focus_solved === focus_shown; a later backspace over an
        // already-clean segment doesn't un-count it). The one per-problem decision funnels into all
        // three counters: the 12-char learnt/relapse window, and the episode asks/succ that drive
        // too-difficult & park - so all three are per class, not per GP pair or per segment. Skips
        // repeats, non-GP-pair (joker/tricky) classes, and problems with no in-focus segment.
        function sched_record_focus_outcome(clean) {
            if(bee.problem.is_repeat || !bee.processed_problem.is_segmented) { return; }
            const pc = bee.problem.problem_class;
            if(!pc || pc.indexOf('/') < 0 || bee.focus_shown === 0) { return; }
            const rec = pairsched(pc);
            rec.asks++;
            if(clean) { rec.succ++; }
            rec.window = (rec.window + (clean ? '1' : '0')).slice(-12);
        }


        function new_question(reason) {  // also called from common.js on successfully answering a question
            console.log('#new_question05() caller=', reason);
            if(check_dismiss_puzzle()) { return; } // puzzle solved: don't generate/speak the next question
            // No problems to play: warn instead of crashing while picking one. Every enabled problem
            // joins a class ('noclass' at worst), so an empty class_to_ix means an empty or
            // entirely disabled problem list.
            if(Object.keys(bee.class_to_ix).length == 0) {
                bee_alert('No problems found for the selected level range. Please choose a different range with "Update level range".');
                return;
            }
            page_update();
            
            try{ document.activeElement.blur(); }catch(e){}
            
            let problem = get_first_on_queue();
            let log = '';
            let intro_problem_ix = undefined; // class intro's example problem; undefined = no intro (queue-restored)

            // Once per page-load, decide how to open. Puzzle mode always starts a fresh cycle slot:
            // purge the leftover queue so the queue-empty branch builds + introduces the next slot.
            // Regular play keeps the persisted anti-cheat queue, re-introducing the class after an idle gap.
            let force_intro = false;
            if(!bee.intro_gap_checked) {
                bee.intro_gap_checked = true;
                if(bee.is_puzzle) {
                    log += ' puzzle_purge';
                    purge_question_queue();
                    problem = undefined;
                } else {
                    const la = bee.storage.players[bee.player].last_active;
                    if(la === undefined || Date.now() - la > bee.intro_gap_ms) { force_intro = true; }
                }
            }

            if(problem !== undefined) {
                log += ' from queue';
                // Out of range, or a problem disabled since the queue was stored
                if(problem.problem_ix >= bee.problem_list.length || bee.problem_list[problem.problem_ix] === false) { log += ' invalid'; problem = undefined; }
                else if(force_intro && count_question_queue() <= 1) {
                    // Returning to a class that has only its last problem left: there is not enough of
                    // it to be worth re-introducing, so drop it and let the branch below open a fresh
                    // class - whose own intro then introduces the class we are actually about to play.
                    log += ' purged_tail';
                    purge_question_queue(); // persisted by the store_question11 calls below
                    problem = undefined;
                }
                else if(force_intro) { // resuming a class after a gap: introduce it
                    log += ' gap_intro';
                    intro_problem_ix = intro_problem_for_class(problem.problem_class, problem.problem_ix);
                }
            }
            if(problem === undefined) { // Need a new cycle slot
                // The slot that just finished (sched.cur) gets its learnt / park / too-difficult
                // check (or joker relapse check), then we advance to the next slot in the cycle.
                const pstore = bee.storage.players[bee.player];
                sched_slot_end_check(pstore.sched ? pstore.sched.cur : null);
                sched_next_slot();
                const problem_class = pstore.sched.cur.cls;
                log += ' slot:'+problem_class+' cursor:'+pstore.sched.cursor;

                // First problem of the slot's run. A non-empty class always returns one.
                const problem_ix = try_get_new_problem10(problem_class);
                log += ' first_problem:'+problem_ix;
                problem = {'problem_ix':problem_ix, 'is_repeat':false, 'problem_class':problem_class};
                store_question11(problem);
                intro_problem_ix = problem_ix; // fallback: the first problem, used only if the class has no other

                const problem_ixs = bee.class_to_ix[problem_class];
                if(problem_ixs !== undefined && problem_ixs.length > 0) {
                    // At most puzzle_needs problems per slot (new-scheduling line 48); a shorter pair
                    // simply spills into the next slot when this run drains (a later new_question
                    // rebuilds from the queue-empty path).
                    const run = Math.min(bee.puzzle_needs, problem_ixs.length);
                    for(let j=1; j<run; j++) { // the first is already queued
                        const class_problem_ix = try_get_new_problem10(problem_class);
                        log += ' class_problem_ix:'+class_problem_ix;
                        if(class_problem_ix !== undefined) {
                            store_question11({'problem_ix':class_problem_ix, 'is_repeat':false, 'problem_class':problem_class});
                        }
                    }
                    // Prefer a random OTHER problem of the class for the intro (don't reveal problem_ix)
                    const intro_choices = problem_ixs.filter(function(ix) { return ix != problem_ix; });
                    if(intro_choices.length > 0) { intro_problem_ix = choose_from(intro_choices); }
                }
            }
            console.log("Selecting new problem:", log);
            // A new class run gets an intro; queue-restored problems (intro_problem_ix undefined) skip it
            if(intro_problem_ix !== undefined) {
                show_class_intro(intro_problem_ix, problem.problem_class, function() { start_question14(problem); });
            } else {
                start_question14(problem); // the first problem
            }
        }

        
        // Parse a problem entry into a data structure
        // <image_ref>@<emoji>|<text>|<class>,<class>,...
        // <image_ref>|<text>|<class>,<class>,...
        // @<emoji>|<text>|<class>,<class>,...
        //
        // <image_ref> is by default local, but is nonlocal if it starts with ~
        // The image part may be an empty string
        // The "|<class>" ending is optional
        //
        // Output: {'text':, 'class':, 'imgref'|'ref':, 'emoji':, 'proc_cache':}
        function process_problem_data(datastr) {
            const data = datastr.split('|');
            if(data.length != 3 && data.length != 2) { console.error("Malformed problem entry", datastr, data); }
            const img = data[0].split('@');
            const out = {
                'text': data[1],
                'class': (data[2] === undefined || data[2].length == 0 ? [] : data[2].split(','))
            };
            if(img[0].length) {
                if(img[0].startsWith('~')) {
                    out.imgref = img[0].slice(1);
                } else {
                    out.ref = img[0];
                }
            }
            if(img[1] !== undefined && img[1].length) { out.emoji = img[1]; }
            process_problem_internals(out);
            return out;
        }


        function init_problem_list() {
            // min_wordset / wordsets are persisted user-data keys, so they keep their historical names
            let min_level = bee.storage.players[bee.player].min_wordset;
            if(min_level === undefined) { min_level = 0; }
            const max_level = bee.storage.players[bee.player].wordsets;

            const r = init_problem_list_impl(min_level, max_level);
            bee.problem_list = r.problem_list;
            bee.class_to_ix = r.class_to_ix;

            $('.d_problemrange').html(
                esc_html(min_level) + " to " + esc_html(max_level)
            );
        }
        
        
        function init_problem_list_impl(min_level, max_level) {
            // TODO min_level and max_level are unused - we load all entries (levels are also not available at this point)
            const out = {};
            
            out.problem_list = []; // problem index -> problem data, or false for a disabled problem
            for(let i=0; i<problem_repository.length; i++) {
                // A `false` entry is a disabled problem: keep its slot so the indices of the others
                // (which players' queues refer to) do not move, but do not process or offer it
                if(problem_repository[i] === false) { out.problem_list.push(false); continue; }
                const pdata = process_problem_data(problem_repository[i]);
                // Derive level from the number of phonemes
                pdata.level = pdata.proc_cache.segments.length;
                out.problem_list.push(pdata);
            }

            // Classes - a disabled problem joins none, so it is unreachable through class_to_ix
            out.class_to_ix = {};
            for(let i=0; i<out.problem_list.length; i++) {
                if(out.problem_list[i] === false) { continue; }
                const pd = out.problem_list[i].proc_cache;
                const cl = out.problem_list[i].class;
                if(pd.is_segmented) {
                    // Add classes from the segments' GP pairs
                    for(let j=0; j<pd.segments.length; j++) {
                        // Split-digraph aware: a vowel marked by a silent "e" (its '/X' box two to the
                        // right) yields "<vowel>.e/<phoneme>" (e.g. "i.e/aI" for "tide"), which the
                        // class_gp_pairs split-digraph entries make its own drillable class.
                        const gp_pair = seg_gp_pair(pd, j);
                        if(class_gp_pairs[gp_pair]) {
                            cl.push(gp_pair);
                        }
                        else if(!other_gp_pairs[gp_pair]) {
                            console.error("Unknown GP pair", gp_pair, pd);
                            other_gp_pairs[gp_pair] = 2;
                        }
                    }
                }
                if(cl.length == 0) { cl.push('noclass'); }
                for(let j=0; j<cl.length; j++) {
                    const thisclass = cl[j];
                    let cllist = out.class_to_ix[thisclass];
                    if(cllist === undefined) {
                        out.class_to_ix[thisclass] = [];
                        cllist = out.class_to_ix[thisclass];
                    }
                    cllist.push(i);
                }
            }

            // Warn about GP-pair classes too small to drill (a singleton's class intro would also
            // reveal the answer).
            for(const cls in out.class_to_ix) {
                const ixs = out.class_to_ix[cls];
                if(ixs.length <= 1 && cls.indexOf('/') >= 0) {
                    console.warn("0 or 1 long GP-pair class (intro reveals answer / cannot drill across problems):", cls, ixs.length);
                }
            }

            return out;
        }

        
        // ---- Problem queue (persisted as pstore.scheduled_questions) ----
        // Entries keep historical key names (word_ix / word_class); to_stored()/from_stored()
        // convert to/from {problem_ix, problem_class, is_repeat}. get_question_queue() returns
        // the RAW array - read entries through from_stored().

        function to_stored(problem) {
            return {'word_ix': problem.problem_ix, 'word_class': problem.problem_class, 'is_repeat': problem.is_repeat};
        }

        function from_stored(entry) {
            return {'problem_ix': entry.word_ix, 'problem_class': entry.word_class, 'is_repeat': entry.is_repeat};
        }

        // Is problem_ix already somewhere on the (raw) queue? Empty slots are skipped.
        function queue_holds_problem(queue, problem_ix) {
            for(let i=0; i<queue.length; i++) {
                if(queue[i] === undefined || queue[i] === null) { continue; }
                if(from_stored(queue[i]).problem_ix == problem_ix) { return true; }
            }
            return false;
        }

        function get_question_queue() {
            delete bee.storage.players[bee.player].current_question;
            if(bee.storage.players[bee.player].scheduled_questions === undefined) {
                bee.storage.players[bee.player].scheduled_questions = [];
            }
            return bee.storage.players[bee.player].scheduled_questions;
        }

        
        function purge_question_queue() {
            bee.storage.players[bee.player].scheduled_questions = [];
        }


        // How many real problems are waiting. Empty slots are skipped: store_question11 refills
        // them, and JSON storage turns an undefined into a null.
        function count_question_queue() {
            const s = get_question_queue();
            let n = 0;
            for(let i=0; i<s.length; i++) {
                if(s[i] !== undefined && s[i] !== null) { n++; }
            }
            return n;
        }

        
        // Record play activity time (persisted with the next save); drives the class-intro-on-return
        // gap check in new_question. Called wherever the queue is already saved.
        function mark_active() {
            if(bee.player !== false) { bee.storage.players[bee.player].last_active = Date.now(); }
        }

        // Store problem on queue, filling up undefineds first
        // Queue is also used to prevent getting a new problem when the page is refreshed
        function store_question11(problem) {
            const s = get_question_queue();
            const entry = to_stored(problem);
            let added = false;
            for(let i=0; i<s.length; i++) {
                if(s[i] === undefined || s[i] === null) {
                    s[i] = entry;
                    added = true;
                    break;
                }
            }
            if(!added) { s.push(entry); }
            mark_active();
            save_storage('store_question');
        }
        
        // Called if the question is answered successfully
        function queue_success() {
            get_question_queue().shift();
            mark_active();
            save_storage('queue_success');
        }
        
        // Schedule question to be shown N questions later. Adds the problem back to the queue once.
        function reschedule_question(problem) {
            console.log('reschedule_question', problem);
            const s = get_question_queue();
            s.shift(); // remove this question
            s.splice(3, 0, to_stored({'problem_ix':problem.problem_ix, 'problem_class':problem.problem_class, 'is_repeat':true}));
            mark_active();
            save_storage('schedule_question');
        }

        // Return the first problem on the queue (in code shape) without taking it off
        function get_first_on_queue() {
            const s = get_question_queue();
            if(s.length == 0) { return undefined; }
            const e = s[0];
            if(e === undefined) { return undefined; }
            if(typeof(e) == 'object') {
                if(e === null) { return undefined; } // JSON storing turns undefined into null
                return from_stored(e);
            }
            return undefined;
        }


        // Choose the level range to draw problems from; result is delivered to callback([min, max])
        function choose_level_range(callback) {
            bee_prompt("What range of levels should we use?\nType a number for the bottom end of the range", function(min_value) {
                let min_level = min_value - 0;
                if(isNaN(min_level)) { min_level = 0; }
                bee_prompt("Type a number from "+min_level+" for the top end of the range", function(max_value) {
                    let max_level = max_value - 0;
                    if(isNaN(max_level)) { max_level = 0; }
                    callback([min_level, max_level]);
                });
            });
        }


        function modify_level_range() {
            if(bee.player === false) { bee_alert("Choose a player first"); return; }
            choose_level_range(function(levels) {
                // min_wordset / wordsets are persisted user-data keys: historical names kept
                bee.storage.players[bee.player].min_wordset = levels[0];
                bee.storage.players[bee.player].wordsets = levels[1];
                call_local_hook('problemset_hook', [String(levels)]);
                purge_question_queue();
                save_storage('modify_level_range');
                init_problem_list();
                new_question('modify_level_range');
            });
        }
        
        
        function main() {
            data_migration();
            document.addEventListener('keydown', process_keypress); // Or use 'keypress' event

            update_score_ui(false);
            $('.d_player').html(esc_html(bee.player));
            init_problem_list();

            bee_aquarium.init_game();
            bee_aquarium.init_food();
            // Switch to aquarium tab automatically after a fish/item gift animation
            bee_aquarium.on_aquarium_gift = function() { switch_to_tab('aquarium'); };

            switch_to_tab('game');
            new_question('main');
        }
        
        // callback() (optional) fires once done.
        function init_player_data(callback) {
            // The level range is unused for problem selection (see init_problem_list_impl), so we no
            // longer prompt for it on new-user creation; assume the full 0..100 range.
            // choose_level_range(function(levels) {
                const levels = [0, 100];
                bee.storage.players[bee.player] = {
                    'data_version': bee_current_data_version,
                    'score': 0,
                    // min_wordset / wordsets / pair_stats are persisted keys: historical names kept
                    'min_wordset': levels[0],
                    'wordsets': levels[1],
                    'pair_stats': {}
                };
                if(callback) { callback(); }
            // });
        }

    </script>

    <script src="assets/aquarium/js/aquarium.js?508"></script>
